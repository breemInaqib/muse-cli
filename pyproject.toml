[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "musecli"
version = "0.1.0"
description = "Local-first museCLI for capture, focus, and daily check-ins."
authors = [{name = "Ibrahim Naqib"}]
readme = "README.md"
requires-python = ">=3.9"
license = "LicenseRef-Proprietary"
keywords = ["cli", "journal", "offline", "productivity", "sqlite", "typer"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Utilities",
]
dependencies = [
  "textual>=8.2,<9",
  "typer>=0.23,<0.25",
]

[project.urls]
Homepage = "https://github.com/breemInaqib/muse-cli"
Repository = "https://github.com/breemInaqib/muse-cli"
Issues = "https://github.com/breemInaqib/muse-cli/issues"
Changelog = "https://github.com/breemInaqib/muse-cli/blob/main/CHANGELOG.md"

[project.scripts]
muse = "musecli.cli:app"
muse-code = "musecli.code_cli:app"

[project.optional-dependencies]
dev = [
  "build>=1.2.0",
  "pytest>=7",
  "ruff>=0.15.11,<0.16",
]

[tool.setuptools.packages.find]
include = ["musecli", "musecli.*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"musecli/cli.py" = ["B008", "UP045"]
"musecli/code_cli.py" = ["B008", "UP045"]
